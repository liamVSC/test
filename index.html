<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox UI Builder</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8eaf0;background:#0c0e13;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0c0e13}button,input,select{font:inherit}button{cursor:pointer;color:inherit}
.top{height:62px;border-bottom:1px solid #242833;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#10131a;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.4px}.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#4f8cff);display:grid;place-items:center;font-weight:900;color:white}
.top-actions,.toolbar{display:flex;gap:8px;align-items:center}.btn{border:1px solid #303644;background:#191e28;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:650}.btn:hover{background:#252c39}.btn.primary{background:#7655e9;border-color:#876bf2;color:white}.btn.primary:hover{background:#876bf2}.btn:disabled{opacity:.35;cursor:not-allowed}
.workspace{display:grid;grid-template-columns:220px minmax(350px,1fr) 270px;height:calc(100vh - 62px);min-height:560px}
.panel{background:#11151d;border-right:1px solid #242833;overflow:auto}.panel.right{border-right:0;border-left:1px solid #242833}.panel-head{padding:17px 16px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:#8c95a6;font-weight:800}.section{padding:0 12px 16px}.section-title{font-size:11px;color:#7f899b;font-weight:700;margin:10px 4px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}.component{border:1px solid #2a3140;background:#171c26;border-radius:10px;padding:12px 8px;text-align:left;font-size:11px;color:#cbd2df}.component:hover{border-color:#8066eb;background:#201d31}.component .glyph{font-size:18px;display:block;margin-bottom:7px}.tree-row{padding:8px 9px;border-radius:7px;font-size:12px;color:#aeb7c7;display:flex;gap:8px;align-items:center;cursor:pointer}.tree-row:hover,.tree-row.active{background:#252039;color:#fff}.tree-row .tree-icon{color:#8e79ed}.center{display:flex;flex-direction:column;min-width:0;background:#0d1016}.toolbar{height:52px;border-bottom:1px solid #242833;padding:0 14px;justify-content:space-between}.toolbar .group{display:flex;gap:7px;align-items:center}.select{background:#171c26;border:1px solid #303644;border-radius:8px;color:#cbd2df;padding:7px 9px;font-size:11px}.stage{flex:1;overflow:auto;display:grid;place-items:center;padding:35px;background-image:radial-gradient(#242a37 1px,transparent 1px);background-size:18px 18px}.device{position:relative;width: min(100%,760px);height: min(100%,480px);min-height:320px;background:#dce6ef;border:7px solid #252b38;border-radius:15px;box-shadow:0 22px 65px #0008;overflow:hidden}.device.mobile{width:260px;height:470px;min-height:470px;border-radius:28px;border-width:8px}.device-label{position:absolute;top:-25px;left:0;color:#737e91;font-size:10px;letter-spacing:.7px;text-transform:uppercase}.canvas{position:absolute;inset:0;overflow:hidden}.node{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;cursor:move;white-space:pre-wrap;text-align:center}.node.selected{outline:2px solid #8b70ff!important;outline-offset:2px}.node.selected:after{content:"";position:absolute;right:-4px;bottom:-4px;width:8px;height:8px;background:#fff;border:2px solid #7655e9;border-radius:2px}.empty{color:#8b95a6;font-size:12px;text-align:center;max-width:250px;line-height:1.6}.inspector{padding:0 14px 24px}.field{margin:13px 0}.field label{display:block;color:#8e98a9;font-size:10px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;background:#191e28;border:1px solid #303644;border-radius:7px;padding:8px;color:#e8eaf0;font-size:11px;min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.colorline{display:flex;gap:8px}.colorline input[type=color]{width:38px;height:32px;padding:2px}.muted{color:#778194;font-size:10px;line-height:1.5}.divider{border-top:1px solid #252b37;margin:15px 0}.status{font-size:10px;color:#778194}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(560px,100%);background:#151a24;border:1px solid #343b4a;border-radius:15px;padding:20px;box-shadow:0 25px 80px #000a}.modal h2{font-size:17px;margin:0 0 8px}.modal textarea{width:100%;height:180px;background:#0d1119;color:#dbe2ef;border:1px solid #343b4a;border-radius:8px;padding:10px;font:11px ui-monospace,monospace;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.mobile-tools{display:none}.panel-close{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#252b39;border:1px solid #454e61;padding:10px 14px;border-radius:9px;font-size:12px;z-index:8;box-shadow:0 8px 25px #0008}
@media(max-width:850px){.workspace{grid-template-columns:170px minmax(0,1fr)}.panel.right{display:block;position:fixed;z-index:10;top:62px;bottom:0;right:0;width:min(42vw,340px);min-width:280px;box-shadow:0 15px 45px #000b;transform:translateX(105%);visibility:hidden;transition:transform .2s ease}.panel.right.mobile-open{transform:translateX(0);visibility:visible}.panel.left{position:relative}.top{padding:0 12px}.top-actions .btn{padding:7px 8px}.stage{padding:26px 14px}.mobile-tools{display:flex;gap:6px}.mobile-tools .btn{padding:8px 9px}}
@media(max-width:560px){body{overflow:hidden}.top{height:56px;padding:0 9px}.brand{gap:7px;font-size:13px}.logo{width:27px;height:27px}.top-actions{gap:5px}.top-actions .btn{padding:8px 9px;font-size:11px}.top-actions #undo,.top-actions #redo{display:none}.top-actions #export{font-size:0}.top-actions #export:after{content:"Export";font-size:11px}.workspace{display:block;height:calc(100dvh - 56px);min-height:0}.center{height:100%;width:100%}.toolbar{height:54px;padding:0 9px;gap:6px}.toolbar .group{gap:5px}.toolbar .select{max-width:145px;padding:8px 6px}.mobile-tools{display:flex;gap:6px}.mobile-tools .btn{padding:9px 10px}.stage{display:grid;place-items:center;overflow:auto;padding:25px 10px 40px;overscroll-behavior:contain}.device{width:min(100%,760px);height:min(62dvh,480px);min-height:280px;flex:none}.device.mobile{width:min(260px,82vw);height:min(68dvh,470px);min-height:350px}.panel.left,.panel.right{display:block;position:fixed;z-index:10;top:56px;bottom:0;width:min(88vw,330px);box-shadow:0 15px 45px #000b;transition:transform .2s ease;visibility:hidden}.panel.left{left:0;transform:translateX(-105%)}.panel.right{right:0;left:auto;transform:translateX(105%);border-left:1px solid #303644;overflow-y:auto;padding-bottom:30px}.panel.left.mobile-open,.panel.right.mobile-open{transform:translateX(0);visibility:visible}.panel-close{display:inline-flex;float:right;margin:10px 12px 0 0;padding:7px 10px}.panel.left .panel-head:first-child,.panel.right .panel-head:first-child{padding-top:17px}.section{padding-bottom:18px}.component{min-height:68px;font-size:12px}.component .glyph{font-size:21px}.field input,.field select{min-height:42px;font-size:14px}.field label{font-size:11px}.btn{min-height:36px}.node{touch-action:none}.node.selected:after{width:12px;height:12px;right:-5px;bottom:-5px}.status{font-size:9px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="logo">U</div><span>Roblox UI Builder</span><span class="status">/ Untitled project</span></div>
 <div class="top-actions"><button class="btn" id="undo">↶</button><button class="btn" id="redo">↷</button><button class="btn" id="save">Save</button><button class="btn" id="open">Open</button><button class="btn primary" id="export">Export for Studio ↗</button></div>
</header>
<main class="workspace">
<aside class="panel left" id="components-panel"><button class="btn panel-close" data-close-panel>Close</button>
 <div class="panel-head">Components</div>
 <div class="section"><div class="section-title">BASIC</div><div class="palette" id="palette"></div></div>
 <div class="divider"></div><div class="panel-head">Hierarchy</div><div class="section" id="tree"></div>
 <div class="section muted">Select an object to edit it. Drag objects around the canvas to position them.</div>
</aside>
<section class="center">
 <div class="toolbar"><div class="group"><div class="mobile-tools"><button class="btn" id="mobile-add">＋ Add</button><button class="btn" id="mobile-undo">↶</button><button class="btn" id="mobile-redo">↷</button><button class="btn" id="mobile-properties">Properties</button></div><select class="select" id="viewport"><option value="desktop">Desktop · 760 × 480</option><option value="mobile">Mobile · 260 × 470</option></select><button class="btn" id="fit">Fit</button></div><div class="group"><span class="status" id="selection-status">No selection</span></div></div>
 <div class="stage"><div class="device" id="device"><div class="device-label">ScreenGui preview</div><div class="canvas" id="canvas"></div></div></div>
</section>
<aside class="panel right" id="properties-panel"><button class="btn panel-close" data-close-panel>Close</button><div class="panel-head">Properties</div><div class="inspector" id="inspector"><div class="empty">Select a component on the canvas or in the hierarchy to edit its properties.</div></div></aside>
</main>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
const $=s=>document.querySelector(s);
const types=[["Frame","▧"],["TextButton","▣"],["TextLabel","T"],["ImageLabel","▧"],["ImageButton","▣"],["ScrollingFrame","☷"]];
let id=1,selected=null,history=[],future=[],drag=null;
const defaults={Frame:{name:"Frame",text:"",x:25,y:20,w:240,h:150,bg:"#ffffff",textColor:"#202633",font:"Gotham",textSize:18,corner:10,stroke:0,strokeColor:"#252b38",transparency:0},TextButton:{name:"Button",text:"Click me",x:35,y:35,w:150,h:48,bg:"#7755e8",textColor:"#ffffff",font:"GothamBold",textSize:16,corner:10,stroke:0,strokeColor:"#252b38",transparency:0},TextLabel:{name:"TextLabel",text:"Hello, Roblox!",x:35,y:35,w:190,h:42,bg:"#ffffff",textColor:"#202633",font:"GothamBold",textSize:20,corner:0,stroke:0,strokeColor:"#252b38",transparency:1},ImageLabel:{name:"ImageLabel",text:"",x:35,y:35,w:110,h:110,bg:"#d9dce5",textColor:"#202633",font:"Gotham",textSize:14,corner:8,stroke:0,strokeColor:"#252b38",transparency:0,image:""},ImageButton:{name:"ImageButton",text:"＋",x:35,y:35,w:90,h:90,bg:"#7755e8",textColor:"#ffffff",font:"GothamBold",textSize:28,corner:12,stroke:0,strokeColor:"#252b38",transparency:0,image:""},ScrollingFrame:{name:"ScrollingFrame",text:"Scroll area",x:35,y:35,w:210,h:140,bg:"#ffffff",textColor:"#202633",font:"Gotham",textSize:14,corner:8,stroke:1,strokeColor:"#aab2c1",transparency:0}};
let nodes=[];
function snapshot(){history.push(JSON.stringify({nodes,selected}));if(history.length>60)history.shift();future=[];refreshButtons()}
function add(type){snapshot();const n={id:id++,type,...defaults[type]};nodes.push(n);selected=n.id;render()}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const c=$("#canvas");c.innerHTML="";const W=c.clientWidth||760,H=c.clientHeight||480;nodes.forEach(n=>{const e=document.createElement("div");e.className="node"+(n.id===selected?" selected":"");e.dataset.id=n.id;e.style.left=n.x/760*W+"px";e.style.top=n.y/480*H+"px";e.style.width=n.w/760*W+"px";e.style.height=n.h/480*H+"px";e.style.background=n.transparency>=1?"transparent":n.bg;e.style.opacity=1-n.transparency;e.style.color=n.textColor;e.style.fontFamily=n.font.includes("Gotham")?"Arial,sans-serif":"Arial,sans-serif";e.style.fontWeight=n.font.includes("Bold")?"700":"400";e.style.fontSize=Math.max(9,n.textSize*W/760)+"px";e.style.borderRadius=n.corner+"px";e.style.border=n.stroke? n.stroke+"px solid "+n.strokeColor:"none";e.textContent=n.type.includes("Image")?(n.image?"":n.text||"Image"):n.text;e.addEventListener("pointerdown",startDrag);e.addEventListener("click",ev=>{ev.stopPropagation();selected=n.id;render();if(window.matchMedia("(max-width:850px)").matches)openPropertiesPanel()});c.appendChild(e)});c.onclick=()=>{selected=null;render();closeMobilePanels()};renderTree();renderInspector();$("#selection-status").textContent=selected?"Selected: "+(nodes.find(n=>n.id===selected)?.name||""):"No selection";refreshButtons()}
function renderTree(){const t=$("#tree");t.innerHTML="";nodes.forEach(n=>{const d=document.createElement("div");d.className="tree-row"+(n.id===selected?" active":"");d.innerHTML='<span class="tree-icon">◈</span>'+safe(n.name)+' <span class="muted">· '+n.type+'</span>';d.onclick=()=>{selected=n.id;render();if(window.matchMedia("(max-width:850px)").matches)openPropertiesPanel()};t.appendChild(d)})}
function field(label,key,value,type="text",extra=""){return '<div class="field"><label>'+label+'</label><input data-key="'+key+'" type="'+type+'" value="'+safe(value)+'" '+extra+'></div>'}
function renderInspector(){const box=$("#inspector"),n=nodes.find(n=>n.id===selected);if(!n){box.innerHTML='<div class="empty">Select a component on the canvas or in the hierarchy to edit its properties.</div>';return}
box.innerHTML='<div class="field"><label>INSTANCE TYPE</label><input value="'+n.type+'" disabled></div>'+field("Name","name",n.name)+field("Text","text",n.text)+
'<div class="divider"></div><div class="section-title">POSITION & SIZE</div><div class="two">'+field("X position","x",n.x,"number") +field("Y position","y",n.y,"number")+'</div><div class="two">'+field("Width","w",n.w,"number")+field("Height","h",n.h,"number")+'</div><div class="divider"></div><div class="section-title">APPEARANCE</div><div class="field"><label>BACKGROUND</label><div class="colorline"><input data-key="bg" type="color" value="'+n.bg+'"><input data-key="bg" value="'+n.bg+'"></div></div><div class="field"><label>TEXT COLOUR</label><div class="colorline"><input data-key="textColor" type="color" value="'+n.textColor+'"><input data-key="textColor" value="'+n.textColor+'"></div></div>'+field("Font","font",n.font)+field("Text size","textSize",n.textSize,"number")+
'<div class="two">'+field("Corner radius","corner",n.corner,"number")+field("Stroke thickness","stroke",n.stroke,"number")+'</div><div class="field"><label>STROKE COLOUR</label><div class="colorline"><input data-key="strokeColor" type="color" value="'+n.strokeColor+'"><input data-key="strokeColor" value="'+n.strokeColor+'"></div></div>'+field("Transparency (0–1)","transparency",n.transparency,"number",'min="0" max="1" step=".05")+
(n.type.includes("Image")?field("Image asset ID / URL","image",n.image||""):"")+
'<div class="divider"></div><button class="btn" id="duplicate">Duplicate</button> <button class="btn" id="delete">Delete</button><p class="muted">Properties map to Roblox UI instance properties. Position and size are stored as pixel offsets for the first version.</p>';
box.querySelectorAll("input[data-key]").forEach(inp=>{inp.addEventListener("change",()=>{snapshot();const key=inp.dataset.key;const val=inp.type==="number"?Number(inp.value):inp.value; n[key]=val;render()})});
$("#delete").onclick=()=>{snapshot();nodes=nodes.filter(x=>x.id!==selected);selected=null;render()};$("#duplicate").onclick=()=>{snapshot();const copy={...n,id:id++,name:n.name+" Copy",x:n.x+18,y:n.y+18};nodes.push(copy);selected=copy.id;render()}
}
function startDrag(e){if(e.button!==0 && e.pointerType!=="touch")return;e.preventDefault();e.stopPropagation();const n=nodes.find(x=>x.id===Number(e.currentTarget.dataset.id));if(!n)return;snapshot();selected=n.id;drag={id:n.id,pointerId:e.pointerId,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y,element:e.currentTarget};try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}renderInspector();renderTree();$("#selection-status").textContent="Selected: "+n.name;if(window.matchMedia("(max-width:850px)").matches)openPropertiesPanel()}
window.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.pointerId)return;const W=$("#device").clientWidth,H=$("#device").clientHeight;const n=nodes.find(x=>x.id===drag.id);if(!n)return;n.x=Math.max(0,Math.round(drag.x+(e.clientX-drag.sx)*760/W));n.y=Math.max(0,Math.round(drag.y+(e.clientY-drag.sy)*480/H));drag.element.style.left=n.x/760*$("#canvas").clientWidth+"px";drag.element.style.top=n.y/480*$("#canvas").clientHeight+"px"});
function finishDrag(e){if(!drag||(e&&e.pointerId!==drag.pointerId))return;drag=null;render();refreshButtons()}
window.addEventListener("pointerup",finishDrag);window.addEventListener("pointercancel",finishDrag);
function refreshButtons(){$("#undo").disabled=!history.length;$("#redo").disabled=!future.length;$("#mobile-undo").disabled=!history.length;$("#mobile-redo").disabled=!future.length}
function restore(stack,other){if(!stack.length)return;other.push(JSON.stringify({nodes,selected}));const s=JSON.parse(stack.pop());nodes=s.nodes;selected=s.selected;id=Math.max(1,...nodes.map(n=>n.id+1));render();refreshButtons()}
$("#undo").onclick=()=>restore(history,future);$("#redo").onclick=()=>restore(future,history);$("#mobile-undo").onclick=()=>restore(history,future);$("#mobile-redo").onclick=()=>restore(future,history);
$("#palette").innerHTML=types.map(([t,g])=>'<button class="component" data-type="'+t+'"><span class="glyph">'+g+'</span>'+t+'</button>').join("");$("#palette").onclick=e=>{const b=e.target.closest("[data-type]");if(b)add(b.dataset.type)};
$("#viewport").onchange=e=>{$("#device").classList.toggle("mobile",e.target.value==="mobile");render()};
$("#fit").onclick=()=>{$("#device").style.transform="scale(1)";render()};
function closeMobilePanels(){document.querySelectorAll(".panel.mobile-open").forEach(p=>p.classList.remove("mobile-open"))}
function openPropertiesPanel(){closeMobilePanels();$("#properties-panel").classList.add("mobile-open")}
$("#mobile-add").onclick=()=>{$("#properties-panel").classList.remove("mobile-open");$("#components-panel").classList.toggle("mobile-open")};
$("#mobile-properties").onclick=()=>{if(!selected){toast("Select a component first.");return}$("#components-panel").classList.remove("mobile-open");$("#properties-panel").classList.toggle("mobile-open")};
document.querySelectorAll("[data-close-panel]").forEach(b=>b.onclick=closeMobilePanels);
$("#palette").addEventListener("click",e=>{if(e.target.closest("[data-type]")&&window.matchMedia("(max-width:850px)").matches)closeMobilePanels()});
window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();restore(e.shiftKey?future:history,e.shiftKey?history:future)}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();restore(future,history)}else if(e.key==="Escape")closeMobilePanels()});
window.addEventListener("resize",()=>{if(!window.matchMedia("(max-width:850px)").matches)closeMobilePanels();render()});
function project(){return {format:"roblox-ui-builder-v1",name:"Roblox UI Builder project",canvas:{width:760,height:480},instances:nodes.map(n=>({...n}))}}
function download(name,content,type){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$("#save").onclick=()=>{localStorage.setItem("roblox-ui-builder-project",JSON.stringify(project()));toast("Project saved in this browser.")};
$("#open").onclick=()=>modal("Open project JSON",'<textarea id="json-input" placeholder="Paste a previously exported project JSON file here"></textarea>',()=>{try{const p=JSON.parse($("#json-input").value);if(!Array.isArray(p.instances))throw Error("Invalid project");snapshot();nodes=p.instances;id=Math.max(1,...nodes.map(n=>n.id+1));selected=null;render();closeModal();toast("Project opened.")}catch(e){toast("Could not open that project JSON.")}});
$("#export").onclick=()=>{download("roblox-ui-builder-project.json",JSON.stringify(project(),null,2),"application/json");modal("Next: create the real Roblox GUI",'<p class="muted">Your design JSON has been downloaded. Open Roblox Studio, install the companion plugin from <b>studio-plugin/RobloxUIBuilder.plugin.lua</b>, open its dock widget, paste the JSON contents, then choose <b>Build GUI</b>. The plugin creates editable Roblox instances (not a runtime GUI script). Select the generated ScreenGui in Explorer and use <b>File → Save to File…</b> to save the actual model as <b>.rbxm</b>.</p><p class="muted">The browser cannot directly generate Roblox binary .rbxm files by itself. The Studio plugin uses Roblox Studio to create and serialize the actual instances.</p><div class="muted">The plugin source and setup instructions are in this GitHub repository.</div>',()=>closeModal(), "Got it")};
function modal(title,body,onok,label="Import"){const root=$("#modal-root");root.innerHTML='<div class="modal-backdrop"><div class="modal"><h2>'+title+'</h2>'+body+'<div class="modal-actions"><button class="btn" id="cancel-modal">Cancel</button><button class="btn primary" id="ok-modal">'+label+'</button></div></div></div>';$("#cancel-modal").onclick=closeModal;$("#ok-modal").onclick=onok}
function closeModal(){$("#modal-root").innerHTML=""}
function toast(s){const r=$("#toast-root");r.innerHTML='<div class="toast">'+safe(s)+'</div>';setTimeout(()=>r.innerHTML="",2600)}
const saved=localStorage.getItem("roblox-ui-builder-project");if(saved){try{nodes=JSON.parse(saved).instances||[]}catch{}}
render();refreshButtons();
</script>
</body></html>
